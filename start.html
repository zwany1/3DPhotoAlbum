<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日祝福页面</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #e74c3c;
            margin-bottom: 20px;
        }
        p {
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            font-size: 16px;
        }
        .button:hover {
            background-color: #2980b9;
        }
        .instructions {
            margin-top: 40px;
            text-align: left;
            background-color: #ecf0f1;
            padding: 20px;
            border-radius: 5px;
        }
        .instructions h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .instructions ul {
            padding-left: 20px;
            color: #555;
        }
        .instructions li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 生日祝福页面已准备就绪！</h1>
        <p>点击下方按钮，开始体验3D旋转盒子和樱花飘落效果</p>
        <a href="index.html" class="button">🎂 打开生日祝福页面</a>
        
        <div class="instructions">
            <h3>使用说明：</h3>
            <ul>
                <li>页面加载后，您将看到一个旋转的3D盒子（闭合状态）</li>
                <li>将鼠标悬浮在盒子上，盒子会暂停旋转并展开</li>
                <li>展开后可以看到外层盒子的6个面</li>
                <li>页面背景有樱花飘落的动画效果</li>
                <li>如果要播放背景音乐，请确保根目录有"renxi.mp3"文件</li>
            </ul>
        </div>
    </div>
</body>
</html>
